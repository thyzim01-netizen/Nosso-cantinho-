<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Cantinho ❤️</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Playfair+Display:wght@400;700&display=swap');

        body {
            font-family: 'Comfortaa', sans-serif;
        }

        .font-romance {
            font-family: 'Playfair Display', serif;
        }

        .glass-card {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,192,203,0.4);
        }

        .dark .glass-card {
            background: rgba(30,25,35,0.85);
        }

        .polaroid {
            background: white;
            padding: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,.1);
            transition: .3s;
        }

        .polaroid:hover {
            transform: scale(1.05);
        }

        .dark .polaroid {
            background: #2d2635;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 1;
            }

            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        .heart-particle {
            position: fixed;
            bottom: -50px;
            animation: floatUp 6s linear forwards;
            pointer-events: none;
            z-index: 999;
        }
    </style>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        romance: {
                            50: '#fff5f6',
                            300: '#fda4af',
                            500: '#f43f5e',
                            600: '#e11d48',
                            darkbg: '#120d16'
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-romance-50 text-gray-800 dark:bg-romance-darkbg dark:text-white min-h-screen pb-16">

<div class="container mx-auto px-4 max-w-2xl py-6">

    <header class="flex justify-between items-center mb-8">
        <div class="flex items-center gap-2">
            <i data-lucide="heart" class="text-romance-500 fill-romance-500"></i>
            <span class="font-bold">Thierry & Mony</span>
        </div>

        <button onclick="trocarTema()" class="bg-white dark:bg-zinc-800 p-3 rounded-full shadow">
            <i data-lucide="moon" id="theme-icon"></i>
        </button>
    </header>

    <div class="text-center mb-8">
        <h1 class="text-5xl font-romance font-bold text-romance-600">
            Nosso Cantinho ❤️
        </h1>
    </div>

    <section class="glass-card rounded-3xl p-6 mb-6">
        <h2 class="text-xl font-bold mb-4">Nossa Playlist 🎵</h2>

        <iframe
            style="border-radius:12px"
            src="https://open.spotify.com/embed/playlist/2Niao5n6BSXOOkBUWecR5O?utm_source=generator"
            width="100%"
            height="152"
            frameBorder="0"
            allowfullscreen=""
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy">
        </iframe>
    </section>

    <section class="glass-card rounded-3xl p-6 mb-6">
        <h2 class="text-xl font-bold mb-4">Humor do Dia 😊</h2>

        <div class="grid grid-cols-2 gap-3 mb-4" id="humor-thierry">
            <button onclick="definirHumor('thierry', 'Feliz', '😊')" class="humor-btn border p-3 rounded-2xl">😊 Feliz</button>

            <button onclick="definirHumor('thierry', 'Cansado', '😴')" class="humor-btn border p-3 rounded-2xl">😴 Cansado</button>

            <button onclick="definirHumor('thierry', 'Saudade', '🥺')" class="humor-btn border p-3 rounded-2xl">🥺 Saudade</button>

            <button onclick="definirHumor('thierry', 'Estressado', '😡')" class="humor-btn border p-3 rounded-2xl">😡 Estressado</button>
        </div>

        <div class="grid grid-cols-2 gap-3" id="humor-ela">
            <button onclick="definirHumor('ela', 'Feliz', '😊')" class="humor-btn border p-3 rounded-2xl">😊 Feliz</button>

            <button onclick="definirHumor('ela', 'Cansada', '😴')" class="humor-btn border p-3 rounded-2xl">😴 Cansada</button>

            <button onclick="definirHumor('ela', 'Saudade', '🥺')" class="humor-btn border p-3 rounded-2xl">🥺 Saudade</button>

            <button onclick="definirHumor('ela', 'Estressada', '😡')" class="humor-btn border p-3 rounded-2xl">😡 Estressada</button>
        </div>
    </section>

    <section class="glass-card rounded-3xl p-6 mb-6">
        <h2 class="text-xl font-bold mb-4">Nosso Jogo 💞</h2>

        <div class="grid grid-cols-2 gap-4">
            <button onclick="modoFofo()" class="bg-pink-500 text-white p-3 rounded-2xl">
                💖 Modo Fofo
            </button>

            <button onclick="modoQuente()" class="bg-red-500 text-white p-3 rounded-2xl">
                🔥 Modo Safadinho
            </button>
        </div>

        <div id="jogoResultado" class="mt-6 p-4 rounded-2xl bg-white dark:bg-zinc-900 border text-center italic">
            Escolha um modo 😭
        </div>
    </section>

</div>

<script>

const FRASES_ROMANTICAS_PADRAO = [
    "Você é meu lugar favorito no mundo ❤️",
    "Seu sorriso melhora qualquer dia meu ❤️",
    "Você é minha paz ❤️",
    "Eu amo você ❤️",
    "Você é meu eterno favorito ❤️"
];

const DESAFIOS_FOFOS = [
    "Diga 3 coisas que fizeram você se apaixonar por mim 💕",
    "Me dê um abraço apertado 🥺",
    "Faça uma massagem relaxante 💆"
];

const DESAFIOS_QUENTES = [
    "Faça um carinho demorado 🔥",
    "Dê um beijo onde quiser 😈",
    "Mande uma mensagem provocativa 🔥",
    "Você escolhe 😉",
    "Faça um chupão onde quiser 😈"
];

function trocarTema() {
    document.documentElement.classList.toggle('dark');
}

function definirHumor(pessoa, humor, emoji) {
    localStorage.setItem(`humor_${pessoa}`, JSON.stringify({ humor, emoji }));

    criarEfeitoCoracoes(5);
}

function modoFofo() {
    const res = document.getElementById('jogoResultado');

    const desafio = DESAFIOS_FOFOS[Math.floor(Math.random() * DESAFIOS_FOFOS.length)];

    res.innerHTML = `💖 ${desafio}`;

    criarEfeitoCoracoes(10);
}

function modoQuente() {
    const res = document.getElementById('jogoResultado');

    const desafio = DESAFIOS_QUENTES[Math.floor(Math.random() * DESAFIOS_QUENTES.length)];

    res.innerHTML = `🔥 ${desafio}`;

    criarEfeitoCoracoes(10);
}

function criarEfeitoCoracoes(qtd) {
    for (let i = 0; i < qtd; i++) {
        const heart = document.createElement('div');

        heart.classList.add('heart-particle');

        heart.innerHTML = '❤️';

        heart.style.left = Math.random() * 100 + 'vw';

        heart.style.fontSize = (Math.random() * 20 + 12) + 'px';

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 6000);
    }
}

window.onload = () => {
    lucide.createIcons();
};

</script>

</body>
</html>
